<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cronómetro – Torneo Municipal de Debate Las Rozas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --goose-blue:     #1a6fc4;
      --goose-dark:     #0d1b2a;
      --goose-mid:      #0f2d4a;
      --goose-light:    #3a9bd5;
      --goose-accent:   #f5a623;
      --white:          #ffffff;
      --danger:         #ff3b3b;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--goose-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }
 
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(26,111,196,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(58,155,213,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
 
    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      background: linear-gradient(135deg, var(--goose-mid) 0%, #0a2238 100%);
      padding: 0 40px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--goose-blue);
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
    }
 
    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
 
    .logo-box {
      height: 90px;
      width: auto;
      display: flex;
      align-items: center;
    }
 
    .logo-box img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
 
    .header-divider {
      width: 2px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
    }
 
    .header-text h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.2;
    }
 
    .header-text p {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--goose-light);
      margin-top: 2px;
    }
 
    .logo-box-right {
      height: 70px;
      width: auto;
      display: flex;
      align-items: center;
    }

    .logo-box-right img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .header-badge {
      background: linear-gradient(135deg, var(--goose-blue), var(--goose-light));
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
    }
 
    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 36px;
      gap: 28px;
    }
 
    /* ── CLOCK CARD ── */
    .clock-card {
      position: relative;
      width: 100%;
      max-width: 700px;
      background: linear-gradient(160deg, var(--goose-mid) 0%, #081724 100%);
      border-radius: 24px;
      padding: 48px 72px;
      text-align: center;
      border: 1px solid rgba(26,111,196,0.35);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 12px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }
 
    .clock-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--goose-blue), var(--goose-light), transparent);
    }
 
    .clock-card::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,111,196,0.12) 0%, transparent 70%);
    }
 
    .phase-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--goose-light);
      margin-bottom: 12px;
      min-height: 1.2em;
      font-weight: 700;
    }
 
    .time-display {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(5.5rem, 15vw, 9.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 6px;
      color: var(--white);
      transition: color 0.2s;
      text-shadow: 0 0 40px rgba(26,111,196,0.3);
      position: relative;
      z-index: 1;
    }
 
    .time-display.warning {
      color: var(--goose-accent);
      text-shadow: 0 0 40px rgba(245,166,35,0.4);
    }
 
    .time-display.blink-red {
      animation: blinkRed 0.7s step-start infinite;
    }
 
    @keyframes blinkRed {
      0%, 100% { color: var(--danger); text-shadow: 0 0 40px rgba(255,59,59,0.5); }
      50%       { color: #ff9999; text-shadow: none; }
    }
 
    .progress-bar-wrap {
      margin-top: 20px;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
 
    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--goose-blue), var(--goose-light));
      transition: width 0.9s linear, background 0.3s;
      width: 100%;
    }
 
    .progress-bar-fill.warning {
      background: linear-gradient(90deg, var(--goose-accent), #ffcc70);
    }
 
    .progress-bar-fill.danger {
      background: linear-gradient(90deg, var(--danger), #ff8080);
    }
 
    .status-bar {
      margin-top: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      min-height: 1.1em;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
 
    /* ── CONTROLS ── */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
 
    .ctrl-btn {
      padding: 13px 36px;
      border-radius: 100px;
      border: 2px solid rgba(255,255,255,0.2);
      background: transparent;
      color: var(--white);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.18s;
      text-transform: uppercase;
    }
 
    .ctrl-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-1px);
    }
 
    .ctrl-btn.primary {
      background: linear-gradient(135deg, var(--goose-blue), var(--goose-light));
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 6px 24px rgba(26,111,196,0.45);
    }
    .ctrl-btn.primary:hover {
      box-shadow: 0 8px 32px rgba(26,111,196,0.6);
      transform: translateY(-2px);
    }
 
    .ctrl-btn.danger-btn {
      border-color: rgba(255,80,80,0.4);
      color: #ff8080;
    }
    .ctrl-btn.danger-btn:hover {
      background: rgba(255,60,60,0.1);
      border-color: var(--danger);
    }
 
    /* ── PHASES GRID ── */
    .phases-section {
      width: 100%;
      max-width: 860px;
    }
 
    .phases-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 14px;
      text-align: center;
      font-weight: 700;
    }
 
    .phases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
 
    .phase-btn {
      background: linear-gradient(160deg, var(--goose-mid), #081724);
      border: 2px solid rgba(26,111,196,0.25);
      border-radius: 16px;
      padding: 18px 14px;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
 
    .phase-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--goose-blue), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
 
    .phase-btn:hover {
      border-color: rgba(26,111,196,0.6);
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
      background: linear-gradient(160deg, #163652, #0d2640);
    }
 
    .phase-btn:hover::before { opacity: 1; }
 
    .phase-btn.active {
      background: linear-gradient(135deg, var(--goose-blue), #1557a0);
      border-color: var(--goose-light);
      box-shadow: 0 8px 32px rgba(26,111,196,0.5);
      transform: translateY(-2px);
    }
 
    .phase-btn.active::before { opacity: 1; background: linear-gradient(90deg, transparent, var(--goose-light), transparent); }
 
    .btn-name {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }
 
    .phase-btn.active .btn-name { color: white; }
 
    .btn-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--goose-light);
    }
 
    .phase-btn.active .btn-time { color: white; }
 
    /* ── GOOSE WATERMARK ── */
    .goose-watermark {
      position: fixed;
      bottom: 60px;
      right: 30px;
      opacity: 0.04;
      pointer-events: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 7rem;
      font-weight: 900;
      letter-spacing: -2px;
      color: white;
      z-index: 0;
    }
 
    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 14px;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
 
    footer span {
      color: var(--goose-light);
      opacity: 0.6;
    }
 
    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 0 16px; height: auto; padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
      .header-badge { display: none; }
      .clock-card { padding: 32px 20px; }
      .phases-grid { grid-template-columns: repeat(2, 1fr); }
      .ctrl-btn { padding: 11px 24px; font-size: 0.9rem; }
      .header-text h1 { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
 
<div class="goose-watermark">GOOSE</div>
 
<header>
  <div class="header-left">
    <div class="logo-box">
      <img src="GOOSE_TALENT_Logo_Color_Sin_fondo__2_.png" alt="Goose Talent" />
    </div>
    <div class="header-divider"></div>
    <div class="header-text">
      <h1>II Concurso de Oratoria Escolar</h1>
      <p>Chamberí</p>
    </div>
  </div>
  <div class="logo-box-right">
    <img src="logo_chamberi.jpg" alt="Distrito Chamberí" />
  </div>
</header>
 
<main>
 
  <!-- Clock display -->
  <div class="clock-card">
    <div class="phase-label" id="phaseLabel">Selecciona un turno</div>
    <div class="time-display" id="timeDisplay">00:00</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status-bar" id="statusBar">– Elige un turno para comenzar –</div>
  </div>
 
  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn primary" id="btnStartPause" onclick="toggleStartPause()">▶ &nbsp;Iniciar</button>
    <button class="ctrl-btn" onclick="resetTimer()">↺ &nbsp;Reiniciar</button>
  </div>
 
  <!-- Phase buttons -->
  <div class="phases-section">
    <div class="phases-title">▪ Turnos del debate ▪</div>
    <div class="phases-grid" id="phasesGrid"></div>
  </div>
 
</main>
 
<footer>
  II Concurso de Oratoria Escolar · Chamberí · 
  <span>Goose Talent</span>
</footer>
 
<script>
  /* ── PHASES ── */
  const PHASES = [
    { name: 'Feedback 4 Equipos',  seconds: 30 * 60 },
    { name: 'Feedback 5 Equipos',  seconds: 37 * 60 },
  ];
 
  /* ── STATE ── */
  let currentPhaseIdx = null;
  let totalSeconds    = 0;
  let elapsed         = 0;
  let running         = false;
  let interval        = null;
 
  /* ── DOM ── */
  const timeDisplay = document.getElementById('timeDisplay');
  const phaseLabel  = document.getElementById('phaseLabel');
  const statusBar   = document.getElementById('statusBar');
  const progressBar = document.getElementById('progressBar');
  const btnSP       = document.getElementById('btnStartPause');
 
  /* ── BUILD PHASE BUTTONS ── */
  const grid = document.getElementById('phasesGrid');
  PHASES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    btn.id = `phase-${i}`;
    btn.innerHTML = `
      <span class="btn-name">${p.name}</span>
      <span class="btn-time">${formatTime(p.seconds)}</span>
    `;
    btn.onclick = () => selectPhase(i);
    grid.appendChild(btn);
  });
 
  /* ── HELPERS ── */
  function formatTime(sec) {
    const abs = Math.abs(sec);
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
 
  function updateDisplay() {
    if (currentPhaseIdx === null) return;
    const remaining = totalSeconds - elapsed;
    const pct = Math.max(0, remaining / totalSeconds * 100);
 
    progressBar.style.width = (remaining >= 0 ? pct : 100) + '%';
 
    if (remaining > 60) {
      timeDisplay.textContent = formatTime(remaining);
      timeDisplay.className = 'time-display';
      progressBar.className = 'progress-bar-fill';
      statusBar.textContent = `Tiempo restante – ${PHASES[currentPhaseIdx].name}`;
    } else if (remaining > 0) {
      timeDisplay.textContent = formatTime(remaining);
      timeDisplay.className = 'time-display warning';
      progressBar.className = 'progress-bar-fill warning';
      statusBar.textContent = `⚠ Último minuto – ${PHASES[currentPhaseIdx].name}`;
    } else if (remaining === 0) {
      timeDisplay.textContent = '00:00';
      timeDisplay.className = 'time-display blink-red';
      progressBar.className = 'progress-bar-fill danger';
      progressBar.style.width = '0%';
      statusBar.textContent = '¡Tiempo agotado!';
    } else {
      const overtimeElapsed = elapsed - totalSeconds;
      timeDisplay.textContent = '+' + formatTime(overtimeElapsed);
      timeDisplay.className = 'time-display blink-red';
      progressBar.className = 'progress-bar-fill danger';
      progressBar.style.width = '100%';
      statusBar.textContent = `⛔ Tiempo extra – ${PHASES[currentPhaseIdx].name}`;
    }
  }
 
  /* ── PHASE SELECT ── */
  function selectPhase(idx) {
    stopTimer();
    currentPhaseIdx = idx;
    totalSeconds    = PHASES[idx].seconds;
    elapsed         = 0;
 
    phaseLabel.textContent = PHASES[idx].name;
    timeDisplay.textContent = formatTime(totalSeconds);
    timeDisplay.className = 'time-display';
    progressBar.className = 'progress-bar-fill';
    progressBar.style.width = '100%';
    statusBar.textContent = 'Listo para iniciar';
    btnSP.innerHTML = '▶ &nbsp;Iniciar';
    btnSP.className = 'ctrl-btn primary';
 
    document.querySelectorAll('.phase-btn').forEach((b, i) => {
      b.classList.toggle('active', i === idx);
    });
  }
 
  /* ── TIMER ── */
  function toggleStartPause() {
    if (currentPhaseIdx === null) return;
    if (running) { pauseTimer(); } else { startTimer(); }
  }
 
  function startTimer() {
    running = true;
    btnSP.innerHTML = '⏸ &nbsp;Pausar';
    btnSP.className = 'ctrl-btn';
    interval = setInterval(() => {
      elapsed++;
      updateDisplay();
    }, 1000);
  }
 
  function pauseTimer() {
    running = false;
    clearInterval(interval);
    btnSP.innerHTML = '▶ &nbsp;Reanudar';
    btnSP.className = 'ctrl-btn primary';
    statusBar.textContent = 'Pausado';
  }
 
  function stopTimer() {
    running = false;
    clearInterval(interval);
  }
 
  function resetTimer() {
    stopTimer();
    if (currentPhaseIdx === null) return;
    elapsed = 0;
    timeDisplay.textContent = formatTime(totalSeconds);
    timeDisplay.className = 'time-display';
    progressBar.className = 'progress-bar-fill';
    progressBar.style.width = '100%';
    statusBar.textContent = 'Reiniciado – listo para iniciar';
    btnSP.innerHTML = '▶ &nbsp;Iniciar';
    btnSP.className = 'ctrl-btn primary';
  }
</script>
</body>
</html>
